[project]
name = "liquidity-depth"
version = "0.1.0"
description = "Uniswap V3/V4 liquidity depth and buyside/sellside imbalance for tokens on Robinhood Chain"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "web3>=6.0,<9.0",
    "eth-abi>=4.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "plotly>=5.20",
    "flask>=3.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
liquidity-depth = "liquidity_depth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["liquidity_depth", "webapp"]

[tool.setuptools.package-data]
webapp = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
